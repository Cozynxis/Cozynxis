<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 258" width="880" height="258" aria-hidden="true">
  <defs>
    <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101021"/>
      <stop offset=".62" stop-color="#151331"/>
      <stop offset="1" stop-color="#211a46"/>
    </linearGradient>
    <radialGradient id="aura">
